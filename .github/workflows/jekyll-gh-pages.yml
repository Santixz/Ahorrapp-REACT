name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Cambia a "master" si es tu rama principal
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # AQUÍ VA EL NOMBRE DE LA CARPETA DONDE ESTÁ TU REACT
        working-directory: ./frontend 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # AQUÍ TAMBIÉN VA LA RUTA EXACTA AL PACKAGE-LOCK.JSON
          cache-dependency-path: './Frontend/package-lock.json' 
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # AQUÍ VA LA RUTA A LA CARPETA DIST QUE GENERA VITE
          path: ./frontend/dist 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4